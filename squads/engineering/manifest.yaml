## Subagentes
| Subagente | Função |
|---|---|
| code-generator | Gera código Python/TS |
| ui-generator | Gera componentes React/Tailwind |
| test-generator | Gera testes unitários/e2e |
| db-migrator | Gera SQL migrations |
| api-stubber | Gera stubs FastAPI/Nest |

## Integrações
- Recebe blueprint de **Architecture Squad**
- Envia scaffold para **Governance Squad**
- Usa templates de **Product Squad**

## Regras
- Sem testes = sem merge
- Sem build passando = não avança
- Código boilerplate = rejeitado
