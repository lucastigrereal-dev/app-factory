# 🟨 Squad Engineering — Manifesto

## Responsabilidades
1. Receber blueprint do Architecture Squad
2. Planejar frontend (app-factory-frontend-planner)
3. Gerar código real (repo-scaffolder, create-*, subagentes)
4. Gerar testes (app-factory-test-oracle)
5. Entregar scaffold executável

## Pipeline interno
```
blueprint → frontend-plan → scaffold → testes → build → handoff → Governance Squad
```

## Checkpoints
- CP-7: Frontend plan tem componentes + rotas + estado?
- CP-8: Scaffold compila/builda sem erro?
- CP-9: Testes cobrem happy path + 2 edge cases?
- CP-10: Código segue padrão do template?

## Agents
| Agent | Função |
|---|---|
| frontend-planner | Planeja UI/UX |
| test-guardian | Valida qualidade de testes |
| scaffold-guardian | Valida estrutura do scaffold |

