# JSON schema for a work order result (placeholder)
$schema: "http://json-schema.org/draft-07/schema#"
title: WorkOrderResult
type: object
properties:
  id:
    type: string
    description: "Identifier of the work order."
  status:
    type: string
    enum: [pending, running, completed, failed]
    description: "Current status of the work order."
  outputs:
    type: object
    description: "Key/value map of generated artefacts."
  started_at:
    type: string
    format: date-time
    description: "Timestamp when the work order started."
  finished_at:
    type: string
    format: date-time
    description: "Timestamp when the work order finished."
  error:
    type: string
    description: "Error message, if the work order failed."
required:
  - id
  - status
  - started_at
additionalProperties: true